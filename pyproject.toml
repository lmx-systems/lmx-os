[project]
name = "lmx-os"
version = "0.1.0"
description = "LMX OS - operational brain for LMX delivery hubs (Phase 1 core backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "geopy>=2.4.1",
    "tenacity>=8.3.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",  # transport dependency for google.auth.transport.requests token refresh
    "pyjwt>=2.8.0",  # driver app session tokens - app/driver_auth/tokens.py
    "python-multipart>=0.0.9",  # Form(...) parsing - the portal's manifest upload
    "bcrypt>=4.1.2",  # client portal password hashing - app/client_auth/passwords.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "fakeredis>=2.23.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real Postgres + Redis (auto-skips if unreachable, see tests/integration/conftest.py)",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
#
# **197 errors is not 197 problems, and that was the problem.** mypy ran with
# no configuration at all against a SQLAlchemy + Pydantic codebase, which is
# the worst case for default-mode false positives, and `ci.yml` made it
# advisory with `|| true`. A number nobody can act on is a number nobody reads.
#
# Sampling the highest-risk categories - the ones that mean "this raises at
# runtime if the value is None" - found four kinds of finding and only one
# real defect:
#
#   * `record/cost.py`'s arithmetic on `datetime | None`: the invariant is
#     real (`source is None` is set exactly when arrive or depart is None) and
#     lives in construction logic the type did not express. False positive.
#   * `password_reset.py` returning `bytes | str | None`: `decode_responses=
#     True` is set in `redis_client.py`. A redis-py stub artifact.
#   * `sqlalchemy.sql.sqltypes.UUID` used to index a `dict[uuid.UUID, ...]`:
#     a known SQLAlchemy typing wart, not a bug.
#   * `delivery/resolution.py` using an unguarded `session.get` result. Real.
#
# So the goal was not zero. It was **a number that means something**, held at
# a baseline that cannot grow - the same bargain the five invariant tests
# make, where an entry is a debt with a name on it rather than a silence.
#
# **197 -> 111, and the two big wins were both one unwritten fact:**
#
#   * 42 of 43 model files annotated `Mapped[UUID]` with SQLAlchemy's dialect
#     type instead of `uuid.UUID`, so every id read as a type object rather
#     than a value. 93 annotations, -48 errors, provably schema-neutral.
#   * `profile_for(create=True)` cannot return None and did not say so. One
#     `@overload`, -22 errors, and `identity/profile.py` went to zero.
#
# **111 -> 0, one call site at a time.** The tail this comment once called
# irreducible was not:
#
#   * redis-py's `bytes | str` replies (`redis.Redis` is not generic in the
#     installed version, so `redis.Redis[str]` is a `type-arg` error) closed
#     with `as_text`, a two-line helper in `redis_client.py` rather than the
#     typed wrapper this predicted.
#   * `StopTiming` needed neither a second dataclass nor a change to REC-2's
#     data flow. Its one reader dropped untimed stops on sight, so the type
#     now means a timed stop and `stop_timings` leaves the others out.
#   * The real optionality got a judgement at each call site. Most was a guard
#     mypy could not follow, restated where the value is used; a few were real
#     defects - a latent report crash among them - fixed in the same pass.
#
# The one `# type: ignore` in `app/` predates all of this. The baseline is now
# empty, so `scripts/mypy_baseline.py` fails CI on the first new error.
[tool.mypy]
python_version = "3.11"
files = ["app"]
# Everything below this line is off by default in mypy's default mode. Turning
# these three on is what makes the check worth running at all: they catch a
# function whose annotations disagree with its body, which is the class of
# error that actually bites.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
# Deliberately NOT enabled yet: `disallow_untyped_defs`, `strict_optional`
# tightening beyond the default, and `disallow_any_generics`. Each would add
# hundreds of findings to a baseline nobody has worked through, which is how
# this ended up ignored the first time.
pretty = true

# Three libraries that ship no stubs and no py.typed marker. Not a code
# problem and not fixable by us - `types-*` packages do not exist for any of
# them. Named individually rather than with a blanket
# `ignore_missing_imports` so a NEW untyped dependency still shows up.
[[tool.mypy.overrides]]
module = ["geopy.*", "reportlab.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
