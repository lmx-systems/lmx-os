name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real Postgres + Redis for tests/integration/ - GitHub Actions manages
    # these as containers alongside the job, no docker-compose needed here.
    # tests/integration/conftest.py auto-skips those tests if it can't
    # reach a real Postgres/Redis, so this also still works if these
    # services ever get removed - it'll just silently stop covering that
    # ground, which is why the "Verify integration tests actually ran"
    # step below exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lmx
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lmx_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://lmx:test@localhost:5432/lmx_os_test
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        # The lock, not the floors. Installing requirements-dev.txt let each run take
        # whatever was newest that day: on 30 Sep 2026 CI was a SQLAlchemy minor ahead
        # of every developer's venv, and a mypy gate that passed locally failed here
        # (#127). See the header of requirements.txt.
        run: pip install -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check app tests

      # Was `mypy app || true` - "advisory only until Phase 1 models settle".
      # Phase 1 has not settled, and the honest cost of that was 197 findings
      # nobody could act on, among which exactly one was a live defect
      # (`delivery/resolution.py` using an unguarded `session.get` result).
      #
      # Still not demanding zero: most of what remains is an invariant the type
      # cannot express, a redis-py stub artifact, or SQLAlchemy's own UUID
      # column type. Held at a per-file baseline instead, which can shrink and
      # cannot grow - the same bargain the five invariant tests make.
      - name: Type check (mypy, held at baseline)
        run: python -m scripts.mypy_baseline

      # `set -o pipefail` is the whole point of this line, and its absence made
      # every CI run since this step was written incapable of failing. A bash
      # pipeline returns the status of its LAST command, so `pytest | tee`
      # reports tee's exit code - zero, always. A red suite went green.
      #
      # Found on 28 September, on the first PR that ever targeted main from a
      # twelve-deep stack: `tests/integration` could not be collected at all
      # (greenlet missing - see requirements.txt) and the job passed in 1m0s
      # with **zero tests executed**.
      - name: Test (unit + integration - real Postgres/Redis service containers above)
        run: |
          set -o pipefail
          pytest tests/ -v --cov=app --cov-report=term-missing | tee /tmp/pytest-output.txt

      # Three ways the suite can produce no result while the step above is
      # happy. Each one has actually happened or nearly did, so each is checked
      # by name rather than by a single clever pattern.
      - name: Verify the suite actually ran
        run: |
          if grep -q "SKIPPED.*Skipping integration tests" /tmp/pytest-output.txt; then
            echo "::error::Integration tests were skipped - the postgres/redis service containers weren't reachable. This should never happen in CI; check the services: block above."
            exit 1
          fi
          # A collection error stops pytest before any test runs. This is what
          # was happening, and the skip check above could not see it because a
          # suite that never collected also never skipped.
          if grep -qE "error during collection|Interrupted:" /tmp/pytest-output.txt; then
            echo "::error::pytest stopped during collection - no tests ran. Read the ERRORS block in the step above."
            exit 1
          fi
          # A summary line is the proof of work. No "N passed" means the run
          # produced nothing, whatever its exit code claimed.
          if ! grep -qE "[0-9]+ passed" /tmp/pytest-output.txt; then
            echo "::error::No 'N passed' summary in the pytest output - the suite produced no result."
            exit 1
          fi

  # Both web frontends. CI covered neither until August 2026, which is how a
  # plain syntax error - a stray double comma in dashboard/src/lib/api.ts -
  # shipped to main and sat there unnoticed.
  #
  # `tsc --noEmit` is NOT sufficient on its own and that is the lesson: it passed
  # on the very error that broke the build. Both steps run, and the build is the
  # one that actually gates.
  frontends:
    runs-on: ubuntu-latest
    strategy:
      # Don't stop the other app's build on the first failure - knowing whether
      # both broke or only one is the useful signal.
      fail-fast: false
      matrix:
        app: [dashboard, client-portal]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

  # driver-app is a separate job rather than a third entry in the matrix above:
  # it is React Native, so there is no `vite build` step, and its lint config
  # has not been migrated to eslint 9 yet. Type checking is the part that
  # matters and the part that was missing - the app's `tsc` was red on main for
  # a while without anything noticing, because nothing in CI ever ran it.
  driver-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci
